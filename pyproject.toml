[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hypgraph"
dynamic = ["version"]
description = "The evidence layer for AI research agents: a hash-chained research record that checks every claim as it is written and derives how well each is known."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Nicolas Houghtaling" }, { name = "VoodooMods LLC" }]
maintainers = [{ name = "VoodooMods LLC" }]
keywords = ["ai-agents", "mcp", "agent-skills", "research", "provenance", "reproducibility", "evaluation", "hypothesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []          # the engine, CLI, HTTP server and Atlas are stdlib only

[project.optional-dependencies]
mcp = ["fastmcp>=2.12"]
test = ["pytest>=8"]
all = ["fastmcp>=2.12", "pytest>=8"]

[project.urls]
Homepage = "https://hypgraph.com"
Documentation = "https://hypgraph.com/engineers/"
Changelog = "https://github.com/voodoomods/hypgraph/blob/main/CHANGELOG.md"
Source = "https://github.com/voodoomods/hypgraph"

[project.scripts]
hypgraph = "hypgraph.cli:main"

[tool.hatch.version]
path = "src/hypgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hypgraph"]

[tool.hatch.build.targets.sdist]
include = ["src/hypgraph", "tests", "docs", "README.md", "DISCLAIMER.md", "LICENSE", "NOTICE", "CITATION.cff", "AGENTS.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/hypgraph/__init__.py"]
addopts = "--doctest-modules --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes: undefined names, unused imports and variables, shadowed definitions. CI runs it on src and tests.
select = ["F"]
