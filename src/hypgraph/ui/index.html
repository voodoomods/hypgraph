<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HypGraph</title>
<link rel="icon" href="hypgraph.svg" type="image/svg+xml">
<link rel="stylesheet" href="hypgraph.css">
<style>
  html, body { margin: 0; height: 100%; }
  #app { height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/layout-base.js"></script>
<script src="vendor/cose-base.js"></script>
<script src="vendor/cytoscape-fcose.js"></script>
<script src="hypgraph.js"></script>
<script>
  const stored = (() => { try { return localStorage.getItem('hypgraph-theme'); } catch { return null; } })();
  HypGraph.mount(document.getElementById('app'), {
    source: HypGraph.HttpSource('api/graph'), hash: true, theme: stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
    onTheme: (t) => { try { localStorage.setItem('hypgraph-theme', t); } catch { /* private mode */ } },
  });
</script>
</body>
</html>
