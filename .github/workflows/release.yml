# Tag v0.1.0 → build the sdist and wheel, test the wheel, publish to PyPI with trusted publishing (no API token:
# configure the "pypi" environment and a trusted publisher for this repository on pypi.org first).
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The tag matches the package version
        run: test "v$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("src/hypgraph/__init__.py").read())[1])')" = "${GITHUB_REF_NAME}"
      - name: The wheel works on its own
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/hypgraph demo >/dev/null && /tmp/w/bin/hypgraph verify
      - name: The wheel and the sdist do what the docs say, from a clean install (dev/e2e_install.py)
        run: |
          python dev/e2e_install.py dist/*.whl --mcp
          python dev/e2e_install.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # the GitHub Release for the tag: the changelog's section, install and provenance notes, and the same files PyPI got
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python dev/release_notes.py "${GITHUB_REF_NAME#v}" -o notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "HypGraph ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
