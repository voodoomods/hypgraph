name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[all]"
      - run: python -m pytest -q
      - name: The engine imports with no dependencies
        run: python -c "import hypgraph, hypgraph.cli, hypgraph.server, hypgraph.bundle; print(hypgraph.__version__)"
      - name: The demo builds, exports and verifies
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          hypgraph demo >/dev/null
          hypgraph export -o demo.bundle.json
          hypgraph verify demo.bundle.json

  ui:
    # the HypGraph UI in a real browser: every view, for every profile fixture, in both themes (dev/ui_smoke.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every view renders with no script error
        run: python dev/ui_smoke.py --chrome google-chrome

  install:
    # a clean install of what would be published, used only as the docs say (dev/e2e_install.py): the wheel with the
    # MCP extra, and the sdist on its own, each in a fresh venv with no checkout on the path
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel, with the MCP extra
        shell: bash
        run: python dev/e2e_install.py dist/*.whl --mcp
      - name: The sdist, on its own
        shell: bash
        run: python dev/e2e_install.py dist/*.tar.gz
