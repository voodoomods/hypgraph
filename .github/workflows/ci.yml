name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[all]"
      - run: python -m pytest -q
      - name: The engine imports with no dependencies
        run: python -c "import hypgraph, hypgraph.cli, hypgraph.server, hypgraph.bundle; print(hypgraph.__version__)"
      - name: The demo builds, exports and verifies
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          hypgraph demo >/dev/null
          hypgraph export -o demo.bundle.json
          hypgraph verify demo.bundle.json
