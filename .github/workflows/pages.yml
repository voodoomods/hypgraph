# hypgraph.com: rebuild the generated site files from the package and publish site/ to GitHub Pages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4          # the homepage record's reviewer verifies bundles with the UI's JS verifier
        with:
          node-version: "20"
      - run: python -m pip install -e ".[test]"
      # the homepage's own record: measured, re-measured, and the page's text checked against it (fails the deploy
      # on a copy error)
      - run: python dev/site_record.py
      - run: python dev/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
